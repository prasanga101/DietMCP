# No card required for this free compute configuration, subject to Render account limits.
# Add private application values in Render Environment after the host is created.
# Weekly PDF emails run independently via GitHub Actions.
services:
  - type: web
    name: dietmcp
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/fitness serve
    healthCheckPath: /health
    envVars:
      - key: MCP_AUTH_ENABLED
        value: 'false'
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: DATA_DIR
        value: /tmp/dietmcp
      - key: STATE_BACKEND
        value: supabase
      - key: TIMEZONE
        value: Asia/Kathmandu
      - key: WEEKLY_EMAIL_ENABLED
        value: 'false'
